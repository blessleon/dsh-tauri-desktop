<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置 - DeepSeek Harness</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #fff;
      padding: 24px;
      font-size: 14px;
      line-height: 1.6;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 24px;
      color: #333;
    }
    .section {
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid #eee;
    }
    .section:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .section-title {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 12px;
      color: #555;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }
    .info-label {
      color: #666;
      font-weight: 500;
    }
    .info-value {
      color: #333;
      font-family: "Consolas", "Monaco", monospace;
      font-size: 13px;
      word-break: break-all;
      text-align: right;
      max-width: 400px;
    }
    .link-button {
      color: #1890ff;
      cursor: pointer;
      text-decoration: none;
      border: none;
      background: none;
      padding: 0;
      font: inherit;
    }
    .link-button:hover {
      text-decoration: underline;
    }
    .switch-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
    }
    .switch-label {
      color: #333;
      font-weight: 500;
    }
    .switch-desc {
      color: #999;
      font-size: 12px;
      margin-top: 4px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 22px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #1890ff;
    }
    input:checked + .slider:before {
      transform: translateX(22px);
    }
    .loading {
      color: #999;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>DeepSeek Harness 设置</h1>

    <div class="section">
      <div class="section-title">版本信息</div>
      <div class="info-row">
        <span class="info-label">App 版本</span>
        <span class="info-value" id="tauri-version">加载中...</span>
      </div>
      <div class="info-row">
        <span class="info-label">dsh 版本</span>
        <span class="info-value" id="dsh-version">加载中...</span>
      </div>
      <div class="info-row">
        <span class="info-label">Node.js 版本</span>
        <span class="info-value" id="node-version">加载中...</span>
      </div>
    </div>

    <div class="section">
      <div class="section-title">路径</div>
      <div class="info-row">
        <span class="info-label">应用数据目录</span>
        <button class="link-button info-value" id="app-data-dir" onclick="openAppDataDir()">加载中...</button>
      </div>
      <div class="info-row">
        <span class="info-label">日志目录</span>
        <button class="link-button info-value" id="log-dir" onclick="openLogDir()">加载中...</button>
      </div>
      <div class="info-row">
        <span class="info-label">Workspace 目录</span>
        <button class="link-button info-value" id="workspace-dir" onclick="openWorkspaceDir()">加载中...</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">启动选项</div>
      <div class="switch-row">
        <div>
          <div class="switch-label">开机自启动</div>
          <div class="switch-desc">在 Windows 用户登录时自动启动应用</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="autostart-toggle" onchange="toggleAutostart()">
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

  <script>
    const { invoke } = window.__TAURI__.core;

    async function loadInfo() {
      try {
        const info = await invoke('get_app_info');
        document.getElementById('tauri-version').textContent = info.tauri_version || '未知';
        document.getElementById('dsh-version').textContent = info.dsh_version || '未知';
        document.getElementById('node-version').textContent = info.node_version || '未知';
        document.getElementById('app-data-dir').textContent = info.app_data_dir || '未知';
        document.getElementById('log-dir').textContent = info.log_dir || '未知';
        document.getElementById('workspace-dir').textContent = info.workspace_dir || '未知';
        document.getElementById('autostart-toggle').checked = info.autostart_enabled;
      } catch (error) {
        console.error('Failed to load app info:', error);
        document.querySelectorAll('.info-value').forEach(el => {
          el.textContent = '加载失败';
        });
      }
    }

    async function openAppDataDir() {
      try {
        await invoke('open_app_data_dir');
      } catch (error) {
        console.error('Failed to open app data directory:', error);
        alert('无法打开应用数据目录: ' + error);
      }
    }

    async function openLogDir() {
      try {
        await invoke('open_log_dir');
      } catch (error) {
        console.error('Failed to open log directory:', error);
        alert('无法打开日志目录: ' + error);
      }
    }

    async function openWorkspaceDir() {
      try {
        await invoke('open_workspace_dir');
      } catch (error) {
        console.error('Failed to open workspace directory:', error);
        alert('无法打开 Workspace 目录: ' + error);
      }
    }

    async function toggleAutostart() {
      const enabled = document.getElementById('autostart-toggle').checked;
      try {
        await invoke('set_autostart', { enabled });
      } catch (error) {
        console.error('Failed to toggle autostart:', error);
        alert('设置自启动失败: ' + error);
        // 回滚开关状态
        document.getElementById('autostart-toggle').checked = !enabled;
      }
    }

    // 页面加载时获取信息
    loadInfo();
  </script>
</body>
</html>
